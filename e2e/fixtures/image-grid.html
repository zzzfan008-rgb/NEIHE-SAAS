      import "@xyflow/react/dist/style.css";
      import "/src/index.css";

        const nodes = useFlowStore(selectActiveNodes);
        return React.createElement(TooltipProvider, null,
          React.createElement("div", { style: { position: "absolute", zIndex: 5, left: 20, top: 15, display: "flex", gap: 8 } },

            React.createElement(Button, { onClick: () => useFlowStore.getState().updateNodeData(id, { outputImages: [first, second] }) }, "两张图片")),
